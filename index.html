<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel de Frota — Pirajá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Identidade Cidade Sol (cores da logo: azul #004557 e amarelo #F0DC14) ===== */
  :root{
    --marca-verde:#00627A; --marca-escuro:#004557; --marca-oliva:#2A8299; --marca-laranja:#F56C12; --marca-amarelo:#F0DC14;
    --bg:#F1F5F7; --painel:#FFFFFF; --card:#FFFFFF; --borda:#D8E3E8; --borda-forte:#BCCDD5; --texto:#0F2A33; --fraco:#5A707A;
    --campo:#FFFFFF; --linha:#EAF1F4; --sombra:0 1px 2px rgba(0,69,87,.07),0 2px 8px rgba(0,69,87,.07);
    --verde:#008C44; --ambar:#E39B00; --azul:#1F6FB2; --ciano:#0E8FA3; --vermelho:#D7263D; --roxo:#7B4FC2; --cinza:#7A8A82; --laranja:#F56C12;
    --aviso-bg:#FFF6E0; --aviso-borda:#F7D489; --aviso-txt:#7A5200;
    --alarme-bg:#FFFFFF; --alarme-txt:#5A0F18;
  }
  [data-tema=escuro]{
    --marca-verde:#1A8AA6;
    --bg:#06171D; --painel:#0A222A; --card:#0D2932; --borda:#173F4C; --borda-forte:#245868; --texto:#E5F0F3; --fraco:#8FA9B2;
    --campo:#081D24; --linha:#123440; --sombra:none;
    --verde:#22B35E; --ambar:#FBAB06; --azul:#4C9BE8; --ciano:#2CC4D8; --vermelho:#F0435A; --roxo:#A58BEA; --cinza:#7F948A;
    --aviso-bg:#2A2208; --aviso-borda:#5A4610; --aviso-txt:#F9D777;
    --alarme-bg:#1F0D10; --alarme-txt:#FFD9DE;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--texto);font:14px/1.4 "Open Sans","Segoe UI",Roboto,Arial,sans-serif}
  button,input,select,textarea{font:inherit}
  .num,.kpi .n,.relogio,.saida .h,.alarme .grande,.gaveta h3,h1{font-family:Montserrat,"Segoe UI",Arial,sans-serif}

  header{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--marca-escuro);color:#fff;position:sticky;top:0;z-index:5}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:var(--marca-amarelo)}
  .marca{display:flex;align-items:center;gap:12px}
  .marca img{height:42px;width:auto;display:none;border-radius:8px;image-rendering:auto}
  .marca svg{width:38px;height:38px;flex:0 0 38px}
  header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
  header .sub{color:#B5D0D8}
  .slogan{color:var(--marca-amarelo);font-weight:600}
  .relogio{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;background:rgba(255,255,255,.08);padding:4px 12px;border-radius:8px}
  .sub{color:var(--fraco);font-size:12px}
  .esp{flex:1}
  .hd-campo{display:flex;align-items:center;gap:6px}
  .hd-campo input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 9px;width:170px}
  .hd-campo input::placeholder{color:#9FC0CA}
  header .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
  header .btn:hover{background:rgba(255,255,255,.18)}
  header .btn.som-off{background:var(--marca-amarelo);border-color:var(--marca-amarelo);color:#002A35;font-weight:700}
  .btn{background:var(--card);border:1px solid var(--borda-forte);color:var(--texto);border-radius:6px;padding:7px 12px;cursor:pointer}
  .btn:hover{border-color:var(--marca-verde)}
  .btn.prim{background:var(--marca-verde);border-color:var(--marca-verde);color:#fff;font-weight:600}
  .btn.perigo{background:var(--vermelho);border-color:var(--vermelho);color:#fff;font-weight:600}
  .btn.ok{background:var(--marca-verde);border-color:var(--marca-verde);color:#fff;font-weight:700}
  .ponto{width:9px;height:9px;border-radius:50%;background:#4ADE80;display:inline-block}
  .ponto.erro{background:#FF6B6B} .ponto.carregando{background:var(--marca-amarelo)}

  .kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;padding:18px 20px 6px}
  .kpi{background:var(--card);border:1px solid var(--borda);border-top:4px solid var(--c,var(--cinza));border-radius:10px;padding:10px 12px;cursor:pointer;user-select:none;box-shadow:var(--sombra)}
  .kpi .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--c,var(--texto))}
  .kpi .l{color:var(--fraco);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .kpi.ativo{outline:2px solid var(--c,var(--marca-verde));outline-offset:1px}

  .barra{display:flex;gap:10px;align-items:center;padding:8px 20px}
  .barra input{flex:0 0 340px;background:var(--campo);border:1px solid var(--borda-forte);color:var(--texto);border-radius:6px;padding:8px 10px}
  .barra input:focus,.campo input:focus,.campo textarea:focus{outline:2px solid var(--marca-verde);outline-offset:0;border-color:transparent}
  .avisos{display:flex;flex-direction:column;gap:4px;padding:0 20px 6px}
  .infos{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 8px;align-items:center}
  .infos .rot{font:700 11.5px Montserrat,Arial,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:var(--fraco);margin-right:2px}
  .chip-info{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--borda);border-radius:999px;padding:5px 6px 5px 12px;cursor:pointer;box-shadow:var(--sombra);font-size:12.5px;font-weight:600;color:var(--texto)}
  .chip-info:hover{border-color:var(--marca-verde)}
  .chip-info .qtd{background:var(--marca-escuro);color:#fff;border-radius:999px;padding:1px 9px;font:700 12px Montserrat,Arial,sans-serif;min-width:26px;text-align:center}
  [data-tema=escuro] .chip-info .qtd{background:var(--marca-verde)}
  .lista-info{max-height:60vh;overflow:auto;margin-top:8px;border:1px solid var(--linha);border-radius:8px}
  .lista-info .li{display:flex;gap:10px;padding:7px 10px;border-bottom:1px solid var(--linha);font-size:13px;align-items:baseline}
  .lista-info .li:last-child{border-bottom:0}
  .lista-info .li[data-v]{cursor:pointer}
  .lista-info .li[data-v]:hover{background:var(--linha)}
  .lista-info .li b{min-width:92px;font-family:Montserrat,Arial,sans-serif}
  .aviso{color:var(--aviso-txt);background:var(--aviso-bg);border:1px solid var(--aviso-borda);border-radius:6px;padding:5px 10px;font-size:12px}

  main{display:grid;grid-template-columns:1fr 430px;gap:14px;padding:6px 20px 20px;align-items:start}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--borda);border-left:5px solid var(--c);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:120px;box-shadow:var(--sombra)}
  .card:hover{border-color:var(--borda-forte);border-left-color:var(--c);transform:translateY(-1px)}
  .card .topo{display:flex;align-items:baseline;gap:8px}
  .card .num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .card .placa{color:var(--fraco);font-size:12px}
  .card .antigo{font:700 13px Montserrat,Arial,sans-serif;color:var(--marca-escuro);background:var(--linha);border-radius:4px;padding:0 5px}
  [data-tema=escuro] .card .antigo{color:var(--texto)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
  .card .linha{font-size:12px;color:var(--fraco);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .info{font-size:12.5px}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--linha);color:var(--fraco);margin-right:4px;display:inline-block;margin-top:2px}
  a.tag.mapa{text-decoration:none;color:var(--marca-verde);font-weight:600}
  a.tag.mapa:hover{text-decoration:underline}
  .tag.alerta{background:color-mix(in srgb,var(--vermelho) 12%,transparent);color:var(--vermelho)}
  .comb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fraco)}
  .comb .trilho{flex:1;height:6px;border-radius:3px;background:var(--linha);overflow:hidden}
  .comb .nivel{height:100%;background:var(--marca-verde)}
  .comb.baixo .nivel{background:var(--laranja)} .comb.baixo{color:var(--laranja);font-weight:700}

  aside{position:sticky;top:72px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 90px)}
  .bloco{background:var(--painel);border:1px solid var(--borda);border-radius:10px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--sombra);overflow:hidden}
  .bloco h2{font:700 12.5px Montserrat,Arial,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--marca-escuro);border-bottom:3px solid var(--marca-amarelo);margin:0;padding:9px 12px;display:flex;justify-content:space-between}
  .bloco.historico h2{background:var(--marca-escuro)}
  .lista{overflow:auto;flex:1}
  .saida{display:grid;grid-template-columns:54px 1fr auto;gap:8px;padding:8px 12px;border-bottom:1px solid var(--linha);align-items:center;cursor:pointer}
  .saida:hover{background:var(--linha)}
  .saida .h{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
  .saida .h small{display:block;color:var(--fraco);font-weight:500;font-size:11px;font-family:"Open Sans",Arial,sans-serif}
  .saida .op{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .saida .vm{font-size:12px;color:var(--fraco)}
  .saida.passada{opacity:.45}
  .historico .item{padding:7px 12px;border-bottom:1px solid var(--linha);font-size:12px}

  /* ALARME */
  .overlay{position:fixed;inset:0;background:rgba(0,30,40,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.aberto{display:flex}
  .alarme{width:min(660px,94vw);background:var(--alarme-bg);color:var(--alarme-txt);border:3px solid var(--vermelho);border-radius:14px;padding:0 0 18px;overflow:auto;max-height:94vh;animation:pisca 1s infinite}
  .alarme .faixa{background:var(--vermelho);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
  .alarme .corpo{padding:12px 20px 0}
  @keyframes pisca{0%,100%{box-shadow:0 0 0 0 rgba(215,38,61,.9)}50%{box-shadow:0 0 70px 20px rgba(215,38,61,.55)}}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:49;display:none;animation:fundo 1s infinite}
  .flash.on{display:block}
  @keyframes fundo{0%,100%{background:rgba(215,38,61,0)}50%{background:rgba(215,38,61,.25)}}
  .alarme h3{margin:0;font:800 14px Montserrat,Arial,sans-serif;text-transform:uppercase;letter-spacing:.6px}
  .alarme .faixa .sub{color:#FFE1E5}
  .alarme .grande{font-size:32px;font-weight:800;margin:4px 0;color:var(--texto)}
  .alarme .det{margin-bottom:10px;color:var(--texto)}
  .alarme fieldset{border:1px solid var(--borda-forte);border-radius:8px;padding:10px 12px;margin:10px 0;color:var(--texto)}
  .alarme label{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer;font-weight:600}
  .alarme input[type=radio]{accent-color:var(--marca-verde);width:18px;height:18px}
  .alarme .acoes{padding:0}
  .alarme .mapa-link{display:inline-flex;align-items:center;gap:6px;margin:2px 0 4px;padding:7px 12px;border-radius:8px;background:var(--marca-escuro);color:#fff;text-decoration:none;font:700 13px Montserrat,Arial,sans-serif}
  .alarme .mapa-link:hover{background:var(--marca-verde)}
  .outras{border:1px dashed var(--borda-forte);border-radius:8px;padding:8px 10px;margin-top:8px;max-height:170px;overflow:auto}
  .outras .tit{font:700 12px Montserrat,Arial,sans-serif;color:var(--marca-escuro);margin-bottom:4px}
  [data-tema=escuro] .outras .tit{color:var(--texto)}
  .alarme .outras label{font-weight:500;margin:3px 0;font-size:13px}
  .campo{display:flex;flex-direction:column;gap:4px;margin:8px 0}
  .campo input,.campo textarea,.campo select{background:var(--campo);border:1px solid var(--borda-forte);color:var(--texto);border-radius:6px;padding:8px;width:100%;min-width:0}
  .erro-msg{color:var(--vermelho);font-size:12px;min-height:16px;font-weight:600}

  /* GAVETA DO VEÍCULO */
  .gaveta{width:min(580px,96vw);max-height:90vh;overflow:auto;background:var(--painel);border:1px solid var(--borda);border-top:5px solid var(--marca-escuro);border-radius:12px;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .gaveta h3{margin:0;font-size:24px}
  .tab{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
  .tab td{padding:5px 6px;border-bottom:1px solid var(--linha);vertical-align:top}
  .tab td:first-child{color:var(--fraco);width:38%}
  .tab a{color:var(--marca-verde);font-weight:600}
  .secao{margin-top:14px;font:700 11.5px Montserrat,Arial,sans-serif;color:var(--marca-verde);text-transform:uppercase;letter-spacing:.6px}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--marca-escuro);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .vazio{color:var(--fraco);padding:14px;text-align:center}

  /* ABA OPERAÇÃO */
  .op-kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding:16px 20px 6px}
  .op-kpis .kpi{border-top:0;border-left:5px solid var(--c,var(--cinza))}
  .op-wrap{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:16px;padding:10px 20px 24px;align-items:start}
  .op-col{display:flex;flex-direction:column;gap:16px}
  .tab-op{width:100%;border-collapse:collapse}
  .tab-op th{text-align:left;font:700 11px Montserrat,Arial,sans-serif;color:var(--fraco);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;background:var(--linha)}
  .tab-op td{padding:9px 12px;border-bottom:1px solid var(--linha);vertical-align:middle}
  .tab-op td.h{font:800 20px Montserrat,Arial,sans-serif;width:100px;white-space:nowrap}
  .tab-op td.h small,.tab-op td.op small{display:block;font:600 11.5px "Open Sans",Arial,sans-serif;color:var(--fraco)}
  .tab-op td.op{font-weight:600}
  .tab-op td.vc{font:800 18px Montserrat,Arial,sans-serif;white-space:nowrap;cursor:pointer}
  .tab-op td.vc s{font:600 11px "Open Sans",Arial,sans-serif;color:var(--fraco);margin-left:4px}
  .tab-op tr.passou td{opacity:.42}
  .tab-op tr.prob td{background:color-mix(in srgb,var(--vermelho) 8%,transparent)}
  .tab-op .btn{padding:4px 10px;font-size:12px}
  .bloco.vermelho h2{background:var(--vermelho)}
  .al-op{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--linha);cursor:pointer}
  .al-op i{align-self:stretch;background:var(--vermelho);border-radius:2px}
  .al-op b{font:800 15px Montserrat,Arial,sans-serif}
  .al-op small{display:block;color:var(--fraco)}
  .al-op a{background:var(--marca-escuro);color:#fff;border-radius:6px;padding:5px 10px;font:700 12px Montserrat,Arial,sans-serif;text-decoration:none;white-space:nowrap}
  .rv{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px 110px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--linha);cursor:pointer}
  .rv:hover{background:var(--linha)}
  .rv b{font:800 16px Montserrat,Arial,sans-serif}
  .rv>div>small{display:block;color:var(--fraco);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rv .fu{height:7px;background:var(--linha);border-radius:4px;overflow:hidden}.rv .fu i{display:block;height:100%}
  .rv .pc{font:700 12px Montserrat,Arial,sans-serif}
  .rv .li{font-size:12px;color:var(--verde);font-weight:600;text-align:right}
  .avisos:empty{display:none}
  .vencida{color:var(--vermelho);font-weight:700}
  .filtro-info{padding:0 20px 8px;font-size:12.5px;color:var(--fraco)}
  .filtro-info a{color:var(--marca-verde);font-weight:700;cursor:pointer}
  .secao-tab{padding:16px 20px 24px}
  .secao-tab .bloco{margin-bottom:16px}
  table.mt{width:100%;border-collapse:collapse;font-size:13px}
  table.mt th{text-align:left;font:700 11px Montserrat,Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--fraco);padding:7px 10px;background:var(--linha)}
  table.mt td{padding:8px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
  table.mt tr{cursor:pointer}
  table.mt tr:hover td{background:var(--linha)}
  table.mt td.vc{font:800 15px Montserrat,Arial,sans-serif;white-space:nowrap}
  .cad-sec{padding:12px 14px}
  .cad-sec .desc{color:var(--fraco);font-size:12.5px;margin-bottom:6px}

  /* ABAS DO PAINEL */
  .abas{display:flex;gap:4px;padding:14px 20px 0;border-bottom:1px solid var(--borda)}
  .abas button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 16px;font:700 14px Montserrat,Arial,sans-serif;color:var(--fraco);cursor:pointer}
  .abas button.ativo{color:var(--marca-escuro);border-bottom-color:var(--marca-amarelo)}
  [data-tema=escuro] .abas button.ativo{color:var(--texto)}
  .abas .n{background:var(--laranja);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;margin-left:4px}

  /* VISTA ESCALAS */
  .esc-barra{display:flex;gap:10px;align-items:center;padding:14px 20px 8px;flex-wrap:wrap}
  .dias{display:flex;background:var(--card);border:1px solid var(--borda-forte);border-radius:8px;overflow:hidden}
  .dias button{border:0;background:none;padding:8px 14px;font:700 13px Montserrat,Arial,sans-serif;color:var(--fraco);cursor:pointer;border-right:1px solid var(--borda)}
  .dias button:last-child{border-right:0}
  .dias button.ativo{background:var(--marca-escuro);color:#fff}
  .dias button small{font:600 11px "Open Sans",Arial,sans-serif;opacity:.8;margin-left:4px}
  .esc-barra input[type=search]{background:var(--campo);border:1px solid var(--borda-forte);color:var(--texto);border-radius:6px;padding:8px 10px;width:300px}
  .esc-barra label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--fraco);cursor:pointer}
  .esc-wrap{display:grid;grid-template-columns:230px 1fr;gap:14px;padding:4px 20px 24px;align-items:start}
  .indice{position:sticky;top:72px;background:var(--painel);border:1px solid var(--borda);border-radius:10px;overflow:hidden;box-shadow:var(--sombra)}
  .indice a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid var(--linha);color:var(--texto);text-decoration:none;font:600 12.5px "Open Sans",Arial,sans-serif}
  .indice a:hover{background:var(--linha)}
  .indice a b{font:800 12px Montserrat,Arial,sans-serif;color:var(--marca-escuro)}
  [data-tema=escuro] .indice a b{color:var(--texto)}
  .grupo{background:var(--painel);border:1px solid var(--borda);border-radius:10px;overflow:hidden;margin-bottom:14px;box-shadow:var(--sombra);scroll-margin-top:80px}
  .grupo h2{margin:0;padding:10px 14px;background:var(--marca-escuro);color:#fff;font:800 14px Montserrat,Arial,sans-serif;letter-spacing:.4px;display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--marca-amarelo)}
  .grupo h2 .sub{color:#B5D0D8;font-size:12px;font-weight:600}
  table.esc{width:100%;border-collapse:collapse;font-size:13px}
  table.esc th{text-align:left;font:700 11px Montserrat,Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--fraco);padding:7px 10px;background:var(--linha)}
  table.esc td{padding:7px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}

  table.esc tr.problema td{background:color-mix(in srgb,var(--vermelho) 7%,transparent)}

  table.esc .hr{font:800 15px Montserrat,Arial,sans-serif;white-space:nowrap}
  table.esc .vc{font:800 15px Montserrat,Arial,sans-serif;white-space:nowrap}
  table.esc .vc s{font:600 11.5px "Open Sans",Arial,sans-serif;color:var(--fraco);margin-left:4px}

  .aviso-troca{border-radius:6px;padding:7px 10px;font-size:12.5px;margin-top:6px}
  .aviso-troca.ok{background:color-mix(in srgb,var(--verde) 12%,transparent);color:var(--verde)}

</style>

<script>
// ====== CONFIGURAÇÃO (versão GitHub) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbw7nGL731INBUOkvL9xIVYyKR3JqkhrQspA1tbuYgXgZbEr6ekqU1gTmcqNZt8zmveXQg/exec';
const CHAVE = 'frota-a2bcac11fa10d649';   // igual a CHAVE_ACESSO do Painel.gs
const INTERVALO = 60;  // segundos entre atualizações
// ==========================================
const STATUS = {
  DISPONIVEL:      {txt:'Disponível',          c:'var(--verde)'},
  ESCALADO:        {txt:'Escalado',            c:'var(--ambar)'},
  EM_OPERACAO:     {txt:'Em operação',         c:'var(--azul)'},
  FORA_SEM_ESCALA: {txt:'Fora da garagem',     c:'var(--ciano)'},
  RETIDO:          {txt:'Retido',              c:'var(--vermelho)'},
  INOPERANTE:      {txt:'Inoperante',          c:'var(--roxo)'}
};
const ORDEM = ['RETIDO','INOPERANTE','ESCALADO','DISPONIVEL','FORA_SEM_ESCALA','EM_OPERACAO'];
const KPIS = [
  ['TOTAL','Frota','var(--cinza)'],['DISPONIVEL','Disponíveis','var(--verde)'],['ESCALADO','Escalados','var(--ambar)'],
  ['EM_OPERACAO','Em operação','var(--azul)'],['FORA_SEM_ESCALA','Fora da garagem','var(--ciano)'],['RETIDO','Retidos','var(--vermelho)'],
  ['INOPERANTE','Inoperantes','var(--roxo)'],['ABASTECER','Abastecer','var(--laranja)']
];
const SIT = {
  NO_LOCAL:['No local','var(--verde)'], FORA:['Fora do local','var(--vermelho)'], SEM_GPS:['GPS antigo','var(--ambar)'],
  SEM_RASTREADOR:['Fora da VF_frota','var(--cinza)'], SEM_LOCAL:['Local não cadastrado','var(--cinza)'],
  RETIDO:['Retido','var(--vermelho)'], INOPERANTE:['Inoperante','var(--roxo)'], SAIU:['Horário passou','var(--cinza)']
};
const TIPO_ALERTA = {
  FORA_DO_LOCAL:'Veículo fora do local de partida', SEM_GPS:'Veículo sem posição de GPS',
  VEICULO_RETIDO:'Veículo retido está escalado', VEICULO_INOPERANTE:'Veículo inoperante está escalado',
  COMBUSTIVEL:'Veículo escalado precisa abastecer'
};

let dados = null, filtro = 'RODAM', fila = [], alertaAtual = null, ocupado = false, offsetRelogio = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hd = (dia, h) => (dia ? dia + ' ' : '') + h;   // "amanhã 04:20"
let ANT = {};   // número principal -> número antigo
const vtxt = n => esc(n) + (ANT[n] ? ' (' + esc(ANT[n]) + ')' : '');
const dist = m => m == null ? '' : (m >= 1000 ? (m/1000).toFixed(1).replace('.',',') + ' km' : m + ' m');

/* ---------- servidor (google.script.run ou simulação local) ---------- */
async function chamar(fn, ...args){
  if (window.SIMULADOR) return window.SIMULADOR[fn](...args);
  let r;
  try {
    r = (fn === 'getPainel' || fn === 'estadoAlertas')
      ? await fetch(API_URL + '?acao=' + (fn === 'getPainel' ? 'dados' : fn) + '&chave=' + encodeURIComponent(CHAVE) + '&t=' + Date.now())
      : await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ acao: fn, chave: CHAVE, args: args }) });
  } catch (e) { throw new Error('sem conexão com o Google'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('resposta inválida (confira se a implantação está como "Qualquer pessoa")'); }
  if (!j.ok) throw new Error(j.erro || 'erro no servidor');
  return j.dados;
}

async function carregar(){
  if (ocupado) return;
  ocupado = true; $('ponto').className = 'ponto carregando';
  try {
    dados = await chamar('getPainel');
    ANT = dados.antigos || {};
    const [h,m,s] = dados.agora.split(':').map(Number);
    const agoraLocal = new Date(); offsetRelogio = (h*3600+m*60+s) - (agoraLocal.getHours()*3600+agoraLocal.getMinutes()*60+agoraLocal.getSeconds());
    $('data').textContent = dados.data;
    $('atualizado').textContent = 'atualizado às ' + dados.agora.slice(0,5) + ' · próxima em ' + INTERVALO + ' s';
    $('ponto').className = 'ponto';
    render();
  } catch (e) {
    $('ponto').className = 'ponto erro';
    $('atualizado').textContent = 'erro ao atualizar: ' + e.message + ' (tentando de novo)';
  } finally { ocupado = false; }
}

/* ---------- render ---------- */
function render(){
  const k = dados.kpis;
  $('kpis').innerHTML = KPIS.map(([id,l,c]) =>
    `<div class="kpi ${filtro===id?'ativo':''}" style="--c:${c}" data-k="${id}"><div class="n">${k[id]||0}</div><div class="l">${l}</div></div>`).join('');
  $('filtroInfo').innerHTML = filtro === 'RODAM'
    ? `Mostrando os carros que podem rodar (sem retidos e inoperantes). <a data-filtro="TOTAL">Ver todos</a>` : (filtro === 'TOTAL' ? `Mostrando a frota toda. <a data-filtro="RODAM">Só os que podem rodar</a>` : `<a data-filtro="RODAM">Limpar filtro</a>`);
  // avisos: "escala de hoje não importada" vai para a Operação; o resto para Cadastros
  const av = dados.avisos || [];
  $('avisosOp').innerHTML = av.filter(a => /Escala de hoje/.test(a)).map(a => `<div class="aviso">⚠ ${esc(a)}</div>`).join('');
  $('avisos').innerHTML = av.filter(a => !/Escala de hoje/.test(a)).map(a => `<div class="aviso">⚠ ${esc(a)}</div>`).join('');
  renderGrade(); renderOperacao(); renderAlertas(); renderManutencao(); renderCadastros();
  const nTr = (dados.escalas || []).filter(e => e.substituido && e.dias >= 0).length;
  $('nTrocas').style.display = nTr ? '' : 'none'; $('nTrocas').textContent = nTr;
  $('nRetidos').style.display = k.RETIDO ? '' : 'none'; $('nRetidos').textContent = k.RETIDO;
  const nCad = av.filter(a => !/Escala de hoje/.test(a)).length + (dados.info || []).length;
  $('nCad').style.display = nCad ? '' : 'none'; $('nCad').textContent = nCad;
  if (vista === 'escalas') renderEscalas();
}

/* ---------- aba Operação ---------- */
const KPIS_OP = [
  ['DISPONIVEL','Disponíveis','var(--verde)','frota'], ['ESCALADO','Escalados (próx. 2 h)','var(--ambar)','frota'],
  ['EM_OPERACAO','Em operação','var(--azul)','frota'], ['FORA_SEM_ESCALA','Fora da garagem','var(--ciano)','frota'],
  ['RETIDO','Retidos','var(--vermelho)','manutencao'], ['INOPERANTE','Inoperantes','var(--roxo)','manutencao'],
  ['ABASTECER','Precisam abastecer','var(--laranja)','frota']
];
function renderOperacao(){
  const k = Object.assign({}, dados.kpis);
  const lista = KPIS_OP;
  $('opKpis').style.gridTemplateColumns = `repeat(${lista.length},minmax(0,1fr))`;
  $('opKpis').innerHTML = lista.map(([id, l, c, ir]) =>
    `<div class="kpi" style="--c:${c}" data-ir="${ir}" data-kf="${id}"><div class="n">${k[id] || 0}</div><div class="l">${l}</div></div>`).join('');

  // próximas saídas
  const s = dados.saidas || [];
  const porVeic = {}; dados.veiculos.forEach(v => porVeic[v.num] = v);
  $('nSaidas').textContent = s.filter(x => x.falta >= 0).length;
  $('opSaidas').innerHTML = s.length ? `<table class="tab-op"><thead><tr><th>Horário</th><th>Operação · motorista</th><th>Veículo</th><th>Situação</th><th></th></tr></thead><tbody>${s.map(x => {
    const [txt, c] = SIT[x.situacao] || [x.situacao, 'var(--cinza)'];
    const extra = x.situacao === 'FORA' ? ' · ' + dist(x.dist) : '';
    const prob = x.falta >= 0 && ['FORA', 'RETIDO', 'INOPERANTE'].includes(x.situacao);
    return `<tr class="${x.falta < 0 ? 'passou' : ''} ${prob ? 'prob' : ''}">
      <td class="h">${esc(x.h)}<small>${x.dia ? x.dia + ' · ' : ''}${x.falta < 0 ? 'há ' + tempo(-x.falta) : 'em ' + tempo(x.falta)}</small></td>
      <td class="op">${esc(x.op)}<small>${esc(x.mot)}${x.local ? ' · ' + esc(x.local) : ''}</small></td>
      <td class="vc" data-v="${esc(x.veic)}">${vtxt(x.veic)}${x.substituido ? `<s>era ${vtxt(x.original)}</s>` : ''}</td>
      <td><span class="badge" style="--c:${c}">${txt}${extra}</span>${x.abastecer ? ' <span class="badge" style="--c:var(--laranja)">⛽</span>' : ''}</td>
      <td>${x.falta >= 0 && x.id ? `<button class="btn" data-troca="${esc(x.id)}">Trocar</button>` : ''}</td></tr>`;
  }).join('')}</tbody></table>` : '<div class="vazio">Nenhuma saída nas próximas horas.</div>';
  $('opSaidas').querySelectorAll('[data-troca]').forEach(b => b.onclick = ev => { ev.stopPropagation(); abrirTroca(b.dataset.troca); });

  // reserva na garagem: disponíveis (na garagem pelo GPS; sem GPS da garagem, todos os disponíveis), por combustível
  const temGaragem = dados.veiculos.some(v => v.naGaragem === true);
  const res = dados.veiculos.filter(v => v.status === 'DISPONIVEL' && (!temGaragem || v.naGaragem === true))
    .sort((a, b) => ((b.combustivel && b.combustivel.pct != null) ? b.combustivel.pct : -1) - ((a.combustivel && a.combustivel.pct != null) ? a.combustivel.pct : -1) || a.num - b.num);
  $('nReserva').textContent = res.length + (temGaragem ? ' na garagem' : ' disponíveis');
  $('opReserva').innerHTML = res.length ? res.map(v => {
    const c = v.combustivel || {};
    const pct = c.pct != null ? c.pct : null;
    const cor = c.precisa ? 'var(--laranja)' : 'var(--verde)';
    return `<div class="rv" data-v="${esc(v.num)}"><div><b>${vtxt(v.num)}</b><small>${esc(v.servico || '')}${v.poltronas ? ' · ' + esc(v.poltronas) + ' lug.' : ''}${v.foraCadastro ? 'não cadastrado na frota' : ''}</small></div>
      ${pct != null ? `<div class="fu"><i style="width:${pct}%;background:${cor}"></i></div><span class="pc" style="color:${cor}">${pct}%</span>` : '<div></div><span class="pc sub">—</span>'}
      <span class="li">${v.proxima ? 'livre até ' + hd(v.proxima.dia, v.proxima.h) : 'livre'}</span></div>`;
  }).join('') : '<div class="vazio">Nenhum carro livre na garagem agora.</div>';
}

/* ---------- aba Manutenção ---------- */
function vencida(ps){
  const m = String(ps || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m || !dados.data) return false;
  const [d, mm, a] = dados.data.split('/');
  return new Date(+m[3], +m[2] - 1, +m[1]) < new Date(+a, +mm - 1, +d);
}
function renderManutencao(){
  const ret = dados.veiculos.filter(v => v.status === 'RETIDO')
    .sort((a, b) => (+(b.retencao && b.retencao.dr) || 0) - (+(a.retencao && a.retencao.dr) || 0));
  $('nMtRet').textContent = ret.length;
  $('mtRet').innerHTML = ret.length ? `<table class="mt"><thead><tr><th>Veículo</th><th>Defeito</th><th>Status</th><th>Responsável</th><th>Entrada</th><th>Previsão</th><th>Dias</th><th>Almoxarifado</th><th>Escala</th></tr></thead><tbody>${ret.map(v => {
    const r = v.retencao || {};
    const esc1 = (dados.escalas || []).find(x => x.veic === v.num && x.falta >= 0);
    return `<tr data-v="${esc(v.num)}"><td class="vc">${vtxt(v.num)}</td><td><b>${esc(r.defeito)}</b></td><td>${esc(r.status)}</td><td>${esc(r.resp)}</td>
      <td>${esc(r.entrada)}</td><td class="${vencida(r.ps) ? 'vencida' : ''}">${esc(r.ps)}${vencida(r.ps) ? ' ⚠' : ''}</td><td><b>${esc(r.dr)}</b></td><td>${esc(r.almox)}</td>
      <td>${esc1 ? `<span class="badge" style="--c:var(--vermelho)">escalado ${esc(hd(esc1.dia, esc1.h))}</span>` : ''}</td></tr>`;
  }).join('')}</tbody></table>` : '<div class="vazio">Nenhum veículo retido.</div>';

  const ino = dados.veiculos.filter(v => v.status === 'INOPERANTE');
  $('nMtInop').textContent = ino.length;
  $('mtInop').innerHTML = ino.length ? `<table class="mt"><thead><tr><th>Veículo</th><th>Motivo</th><th>Marcado por</th><th>Quando</th><th></th></tr></thead><tbody>${ino.map(v => {
    const m = v.manual || {};
    return `<tr data-v="${esc(v.num)}"><td class="vc">${vtxt(v.num)}</td><td><b>${esc(m.motivo)}</b></td><td>${esc(m.operador)}</td><td>${esc(m.quando)}</td><td><span class="sub">clique para liberar</span></td></tr>`;
  }).join('')}</tbody></table>` : '<div class="vazio">Nenhum veículo marcado como inoperante.</div>';
}

/* ---------- aba Cadastros ---------- */
function renderCadastros(){
  const inf = dados.info || [];
  $('cadLista').innerHTML = inf.length ? inf.map(i => `<div class="bloco"><h2>${esc(i.titulo)} <span>${i.tipo === 'texto' ? '!' : i.itens.length}</span></h2>
    <div class="cad-sec"><div class="desc">${esc(i.desc)}</div>
    ${i.itens.length ? `<div class="lista-info">${i.itens.map(x => i.tipo === 'veiculo'
      ? `<div class="li" data-v="${esc(x.num)}"><b>${vtxt(x.num)}</b><span class="sub">${esc(x.txt)}</span></div>`
      : `<div class="li"><b>${esc(x.h || '')}</b><span>${esc(x.txt)}</span></div>`).join('')}</div>` : ''}</div></div>`).join('')
    : '<div class="vazio">Nenhuma pendência de cadastro. 👍</div>';
}

function passaFiltro(v){
  if (filtro === 'TOTAL') return true;
  if (filtro === 'RODAM') return v.status !== 'RETIDO' && v.status !== 'INOPERANTE';
  if (filtro === 'ABASTECER') return v.combustivel && v.combustivel.precisa;
  return v.status === filtro;
}

function renderGrade(){
  const q = $('busca').value.trim().toUpperCase();
  const lista = dados.veiculos.filter(passaFiltro).filter(v => !q || [v.num,ANT[v.num]||'',v.placa,v.cidade||'',v.linha,v.servico,
    ...(v.escalas||[]).map(e => e.op + ' ' + e.mot)].join(' ').toUpperCase().includes(q))
    .sort((a,b) => ORDEM.indexOf(a.status)-ORDEM.indexOf(b.status) || Number(a.num)-Number(b.num));
  $('contagem').textContent = lista.length + ' veículo(s)';
  $('grade').innerHTML = lista.length ? lista.map(card).join('') : '<div class="vazio">Nenhum veículo neste filtro.</div>';
}

function card(v){
  const s = STATUS[v.status] || {txt:v.status,c:'var(--cinza)'};
  let info = '';
  if (v.status === 'RETIDO' && v.retencao) info = `<b>${esc(v.retencao.defeito)}</b><br><span class="sub">${esc(v.retencao.status)} · ${esc(v.retencao.resp)}${v.retencao.ps ? ' · prev. ' + esc(v.retencao.ps) : ''}</span>`;
  else if (v.status === 'INOPERANTE' && v.manual) info = `<b>${esc(v.manual.motivo)}</b><br><span class="sub">por ${esc(v.manual.operador)} · ${esc(v.manual.quando)}</span>`;
  else if (v.proxima) info = `Próx.: <b>${hd(v.proxima.dia, v.proxima.h)}</b> ${esc(v.proxima.op)}<br><span class="sub">${esc(v.proxima.mot)} · em ${tempo(v.proxima.emMin)}</span>`;
  else if (v.ultimaSaida) info = `<span class="sub">Última saída ${hd(v.ultimaSaida.dia, v.ultimaSaida.h)} · ${esc(v.ultimaSaida.op)}</span>`;
  else info = '<span class="sub">Sem escala</span>';

  const tags = [];
  if (!v.gps) tags.push('<span class="tag">não está na VF_frota</span>');
  else if (!v.gps.ok) tags.push(`<span class="tag alerta">${v.gps.lat == null ? 'posição inválida' : 'GPS antigo' + (v.cidade ? ' · ' + esc(v.cidade) : '') + ' · ' + esc(v.gps.quando)}</span>`);
  else {
    const onde = v.naGaragem === true ? 'na garagem'
      : v.localAtual ? '📍 ' + esc(v.localAtual)
      : v.gps.ref ? '📍 ' + esc(v.gps.ref)
      : v.cidade ? '📍 ' + esc(v.cidade)
      : v.naGaragem === false ? 'a ' + dist(v.distGaragem) + ' da garagem' : 'GPS ok';
    tags.push(`<a class="tag mapa" target="_blank" href="https://www.google.com/maps?q=${v.gps.lat},${v.gps.lng}" title="Abrir no mapa">${onde} · há ${tempo(v.gps.idadeMin)}</a>`);
  }
  if (v.escalas && v.escalas.some(e => e.substituido)) tags.push('<span class="tag alerta">substituto</span>');
  if (v.foraCadastro) tags.push('<span class="tag">não cadastrado na frota</span>');

  return `<div class="card" style="--c:${s.c}" data-v="${esc(v.num)}">
    <div class="topo"><span class="num">${esc(v.num)}</span>${ANT[v.num] ? `<span class="antigo">${esc(ANT[v.num])}</span>` : ''}<span class="placa">${esc(v.placa)}</span><span class="esp"></span><span class="badge">${s.txt}</span></div>
    <div class="linha" title="${esc(v.linha)}">${esc(v.servico)}${v.linha ? ' · ' + esc(v.linha) : ''}</div>
    <div class="info">${info}</div>
    <div>${tags.join('')}</div>
    ${barraComb(v.combustivel)}
  </div>`;
}

function barraComb(c){
  if (!c) return '';
  if (c.semConsumo) return '<div class="comb">Combustível: sem faixa de consumo</div>';
  if (c.semRegistro) return '<div class="comb">Combustível: aguardando 1º abastecimento</div>';
  if (c.semHodometro) return '<div class="comb">Combustível: sem hodômetro</div>';
  return `<div class="comb ${c.precisa?'baixo':''}" title="${c.kmDesde} km desde ${esc(c.ultimo)} · média ${String(c.media).replace('.',',')} km/l (${c.origemMedia === 'real' ? 'real do veículo' : 'da faixa'})">⛽ <div class="trilho"><div class="nivel" style="width:${c.pct}%"></div></div>${c.pct}% · ~${c.kmRestante} km</div>`;
}

function tempo(min){
  if (min == null) return '?';
  if (min < 60) return min + ' min';
  const h = Math.floor(min/60), m = min%60;
  return h + 'h' + (m ? String(m).padStart(2,'0') : '');
}

function renderAlertas(){
  const a = dados.alertas || [];
  if ($('listaAlertas')) $('nAlertas').textContent = a.length;
  if ($('listaAlertas')) $('listaAlertas').innerHTML = a.length ? a.map(x => {
    const v = dados.veiculos.find(y => y.num === String(x.veic));
    const mapa = v && v.gps && v.gps.lat != null ? `<a target="_blank" href="https://www.google.com/maps?q=${v.gps.lat},${v.gps.lng}">📍 Mapa</a>` : '';
    return `<div class="al-op" data-alerta="${esc(x.id)}"><i></i><div><b>${vtxt(x.veic)} · ${esc(hd(x.dia, x.h))}</b> — ${esc(TIPO_ALERTA[x.tipo] || x.tipo)}<small>${esc(x.op)}</small></div>${mapa}</div>`;
  }).join('') : '<div class="vazio">Nenhum alerta em aberto.</div>';
  // fila do alarme: tudo que está aberto no servidor
  const ids = new Set(a.map(x => x.id));
  fila = a.slice();
  if (alertaAtual && !ids.has(alertaAtual.id)) fecharAlarme();      // baixado por outro operador
  if (!alertaAtual && fila.length) abrirAlarme(fila[0]);
  else if (alertaAtual) $('alFila').textContent = filaTxt();
}

/* ---------- alarme ---------- */
function filaTxt(){ const i = fila.findIndex(x => alertaAtual && x.id === alertaAtual.id); return fila.length > 1 ? `Alerta ${i+1} de ${fila.length}` : ''; }

function abrirAlarme(a){
  alertaAtual = a;
  $('alTipo').textContent = TIPO_ALERTA[a.tipo] || a.tipo;
  $('alFila').textContent = filaTxt();
  $('alTitulo').innerHTML = `Veículo ${vtxt(a.veic)} · ${esc(hd(a.dia, a.h))}`;
  $('alDet').innerHTML = `${esc(a.op)}<br>${esc(a.motivo)}${a.local ? '<br>Local: ' + esc(a.local) : ''}`;
  // link do mapa com a última coordenada conhecida do veículo
  const v = (dados.veiculos || []).find(x => x.num === String(a.veic));
  if (v && v.gps && v.gps.lat != null) {
    const onde = v.naGaragem ? 'na garagem' : v.localAtual || v.cidade || (v.distGaragem != null ? 'a ' + dist(v.distGaragem) + ' da garagem' : '');
    $('alMapa').innerHTML = `<a class="mapa-link" target="_blank" href="https://www.google.com/maps?q=${v.gps.lat},${v.gps.lng}">📍 Ver o veículo no Google Maps</a>
      <div class="sub">Última posição: ${esc(v.gps.quando)}${onde ? ' · ' + esc(onde) : ''}${v.gps.ok ? '' : ' · <b style="color:var(--vermelho)">posição antiga</b>'}</div>`;
  } else {
    $('alMapa').innerHTML = `<div class="sub">📍 ${v && v.gps ? 'Posição inválida na VF_frota' : 'Veículo sem coordenada na VF_frota'}</div>`;
  }
  // outras viagens do mesmo veículo que ainda vão acontecer (hoje marcadas, amanhã desmarcadas)
  const chave = String(a.id).split('|').slice(0, 4).join('|');
  const outras = (dados.escalas || []).filter(e => e.veic === String(a.veic) && e.id !== chave && e.falta >= 0);
  $('alOutras').innerHTML = outras.length ? `<div class="outras"><div class="tit">Trocar também as outras viagens do ${vtxt(a.veic)}:</div>
    ${outras.map(e => `<label><input type="checkbox" class="alOutra" value="${esc(e.id)}" ${e.dias <= 0 ? 'checked' : ''}> ${esc(hd(e.dia, e.h))} · ${esc(e.op)}</label>`).join('')}</div>`
    : `<div class="sub" style="margin-top:4px">O ${vtxt(a.veic)} não tem outras viagens pela frente.</div>`;
  $('alCheck').innerHTML = '';
  const atual = (dados.escalas || []).find(e => e.id === chave);
  const conferir = () => {
    const alvos = [atual].concat([...document.querySelectorAll('.alOutra:checked')].map(c => (dados.escalas || []).find(e => e.id === c.value))).filter(Boolean);
    $('alCheck').innerHTML = conferirVeiculo($('alVeic').value, alvos);
  };
  $('alVeic').oninput = conferir;
  document.querySelectorAll('.alOutra').forEach(c => c.onchange = conferir);
  document.querySelectorAll('input[name=resp]').forEach(r => r.checked = false);
  $('alVeic').value = ''; $('alObs').value = ''; $('alNome').value = ''; $('alErro').textContent = '';
  $('alAlterar').style.display = 'none'; $('alObsLbl').textContent = 'Observação (opcional)';
  $('ovAlarme').classList.add('aberto'); $('flash').classList.add('on');
  iniciarSirene();
}

function fecharAlarme(){
  alertaAtual = null;
  $('ovAlarme').classList.remove('aberto'); $('flash').classList.remove('on');
  pararSirene();
  const prox = fila.find(x => true);
  if (prox) abrirAlarme(prox);
}

document.addEventListener('change', e => {
  if (e.target.name === 'resp') {
    const alt = e.target.value === 'ALTERADO';
    $('alAlterar').style.display = alt ? '' : 'none';
    $('alObsLbl').textContent = alt ? 'Motivo da alteração (obrigatório)' : 'Observação (opcional)';
    if (alt) $('alVeic').focus();
  }
});

$('alBaixar').onclick = async () => {
  const r = document.querySelector('input[name=resp]:checked');
  const op = $('alNome').value.trim();
  const veic = $('alVeic').value.trim(), obs = $('alObs').value.trim();
  if (!r) return erroAl('Escolha: confirmar o mesmo veículo ou sugerir alteração.');
  if (r.value === 'ALTERADO' && !veic) return erroAl('Informe o veículo sugerido.');
  if (r.value === 'ALTERADO' && !obs) return erroAl('Informe o motivo da alteração.');
  if (op.length < 3) { $('alNome').focus(); return erroAl('Digite o seu nome para dar baixa.'); }
  $('alBaixar').disabled = true;
  try {
    const outras = r.value === 'ALTERADO' ? [...document.querySelectorAll('.alOutra:checked')].map(c => c.value) : [];
    await chamar('baixarAlerta', alertaAtual.id, r.value, veic, obs, op, outras);
    const id = alertaAtual.id;
    fila = fila.filter(x => x.id !== id);
    if (dados) dados.alertas = dados.alertas.filter(x => x.id !== id);
    toast(outras.length ? `Alerta baixado e ${outras.length + 1} viagens trocadas.` : 'Alerta baixado.');
    fecharAlarme(); carregar();
  } catch (e) {
    if (/já foi baixado/.test(e.message)) { removerAlertaLocal(alertaAtual.id, e.message); carregar(); }
    else erroAl(e.message);
  }
  finally { $('alBaixar').disabled = false; }
};
function erroAl(m){ $('alErro').textContent = m; }

/* ---------- sincronização entre telas ---------- */
function removerAlertaLocal(id, msg){
  fila = fila.filter(x => x.id !== id);
  if (dados) dados.alertas = (dados.alertas || []).filter(x => x.id !== id);
  if (alertaAtual && alertaAtual.id === id) { fecharAlarme(); if (msg) toast(msg); }
  if (dados) renderAlertas();
}
async function verificarAlertas(){
  try {
    if (!dados || ocupado) return;
    const st = await chamar('estadoAlertas');
    const abertos = new Set(st.abertos || []);
    // baixados em outro computador
    (dados.alertas || []).filter(a => !abertos.has(a.id)).forEach(a =>
      removerAlertaLocal(a.id, 'Alerta ' + a.veic + ' (' + a.h + ') baixado por ' + ((st.baixas || {})[a.id] || 'outro operador') + '.'));
    // alerta novo que esta tela ainda não tem: atualiza na hora
    const conhecidos = new Set((dados.alertas || []).map(a => a.id));
    if ([...abertos].some(id => !conhecidos.has(id))) carregar();
  } catch (e) { /* silencioso: a atualização normal de 60 s continua */ }
  finally { setTimeout(verificarAlertas, alertaAtual ? 5000 : 15000); }
}

/* ---------- som ---------- */
let audio = null, sirene = null;
function ativarSom(){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    $('btnSom').textContent = '🔊 Som ativo'; $('btnSom').classList.remove('som-off');
    $('alSomAviso').textContent = '';
  } catch (e) {}
}
function bip(freq, ini, dur){
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, audio.currentTime + ini);
  g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + ini + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + ini + dur);
  o.connect(g).connect(audio.destination); o.start(audio.currentTime + ini); o.stop(audio.currentTime + ini + dur + 0.05);
}
function tocar(){ if (audio && audio.state === 'running') { bip(880,0,.22); bip(660,.25,.22); bip(880,.5,.22); bip(660,.75,.22); } }
function iniciarSirene(){
  pararSirene();
  if (!audio || audio.state !== 'running') $('alSomAviso').textContent = 'Som desativado: clique em qualquer lugar para ativar.';
  tocar(); sirene = setInterval(tocar, 1500);
  piscarTitulo(true);
}
function pararSirene(){ clearInterval(sirene); sirene = null; piscarTitulo(false); }
let tituloTimer = null; const tituloOrig = document.title;
function piscarTitulo(on){
  clearInterval(tituloTimer); document.title = tituloOrig;
  if (on) tituloTimer = setInterval(() => { document.title = document.title === tituloOrig ? '⚠ ALERTA DE FROTA' : tituloOrig; }, 800);
}
document.addEventListener('pointerdown', ativarSom, {capture:true});
$('btnSom').onclick = ativarSom;

/* ---------- detalhes do veículo ---------- */
document.addEventListener('click', e => {
  const kf = e.target.closest('[data-kf]');
  if (kf) {
    if (kf.dataset.kf === 'ALERTAS') { const a = (dados.alertas || [])[0]; if (a && !alertaAtual) abrirAlarme(a); return; }
    if (kf.dataset.ir === 'frota') { filtro = kf.dataset.kf; trocarVista('frota'); render(); return; }
    if (kf.dataset.ir) { trocarVista(kf.dataset.ir); return; }
  }
  const fl = e.target.closest('[data-filtro]');
  if (fl) { filtro = fl.dataset.filtro; render(); return; }
  const la = e.target.closest('[data-alerta]');
  if (la && !e.target.closest('a')) { const a = (dados.alertas || []).find(x => x.id === la.dataset.alerta); if (a && !alertaAtual) abrirAlarme(a); return; }
  const bi = e.target.closest('[data-info]');
  if (bi) { abrirInfo(bi.dataset.info); return; }
  const k = e.target.closest('.kpi');
  if (k) { filtro = filtro === k.dataset.k ? 'RODAM' : k.dataset.k; render(); return; }
  if (e.target.closest('a')) return;
  const c = e.target.closest('[data-v]');
  if (c && (!e.target.closest('.overlay') || e.target.closest('.lista-info'))) abrirVeiculo(c.dataset.v);
  if (e.target.id === 'ovVeic') $('ovVeic').classList.remove('aberto');
});

function abrirVeiculo(num){
  const v = dados.veiculos.find(x => x.num === String(num));
  if (!v) return;
  const s = STATUS[v.status] || {txt:v.status,c:'var(--cinza)'};
  const linha = (l, x) => x ? `<tr><td>${l}</td><td>${x}</td></tr>` : '';
  const c = v.combustivel || {};
  $('gaveta').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px"><h3>${vtxt(v.num)}</h3><span class="badge" style="--c:${s.c}">${s.txt}</span><span class="esp" style="flex:1"></span><button class="btn" id="gvFechar">Fechar</button></div>
    <table class="tab">
      ${linha('Placa', esc(v.placa))}${linha('Tipo / carroceria', esc(v.servico))}${linha('Alocação', esc(v.linha))}${linha('Setor', esc(v.setor))}
      ${linha('Ano · poltronas', [v.ano, v.poltronas && v.poltronas + ' lugares'].filter(Boolean).join(' · '))}${linha('Ar · sanitário', [v.ar && 'Ar: ' + esc(v.ar), v.sanitario && 'WC: ' + esc(v.sanitario)].filter(Boolean).join(' · '))}
      ${linha('Posição', v.gps ? (v.gps.ok ? (v.naGaragem === true ? 'Na garagem' : v.localAtual ? esc(v.localAtual) : v.gps.ref ? esc(v.gps.ref) : v.cidade ? esc(v.cidade) + (v.distGaragem != null ? ' (a ' + dist(v.distGaragem) + ' da garagem)' : '') : v.naGaragem === false ? 'A ' + dist(v.distGaragem) + ' da garagem' : 'GPS ok') : v.gps.lat == null ? 'Posição inválida' : 'GPS antigo') + ' · ' + esc(v.gps.quando) + (v.gps.lat != null ? ` · <a target="_blank" href="https://www.google.com/maps?q=${v.gps.lat},${v.gps.lng}">ver no mapa</a>` : '') : 'Não está na aba VF_frota')}
      ${linha('Hodômetro', v.gps && v.gps.km != null ? Math.round(v.gps.km).toLocaleString('pt-BR') + ' km' : '')}
      ${linha('Combustível', c.pct != null ? `${c.pct}% · ~${c.kmRestante} km restantes<br><span class="sub">${c.kmDesde} km desde o abastecimento de ${esc(c.ultimo)} (${c.ultimoLitros} L) · média ${String(c.media).replace('.',',')} km/l ${c.origemMedia === 'real' ? 'real do veículo' : 'da faixa ' + esc(c.faixa)} · tanque ${c.tanque} L</span>` : c.semConsumo ? 'Sem faixa de consumo (confira os lugares)' : c.semRegistro ? 'Aguardando 1º abastecimento na planilha' : c.semHodometro ? 'Sem hodômetro do GPS' : '')}
    </table>
    ${v.retencao ? `<div class="secao">Retenção</div><table class="tab">${linha('Defeito', esc(v.retencao.defeito))}${linha('Status', esc(v.retencao.status))}${linha('Responsável', esc(v.retencao.resp))}${linha('Entrada · previsão', esc(v.retencao.entrada) + (v.retencao.ps ? ' · ' + esc(v.retencao.ps) : ''))}${linha('Dias retido', esc(v.retencao.dr))}${linha('Almoxarifado', esc(v.retencao.almox))}</table>` : ''}
    ${v.manual ? `<div class="secao">Inoperante (manual)</div><table class="tab">${linha('Motivo', esc(v.manual.motivo))}${linha('Por', esc(v.manual.operador) + ' · ' + esc(v.manual.quando))}</table>` : ''}
    <div class="secao">Escalas (ontem, hoje e amanhã)</div>
    <table class="tab">${(v.escalas||[]).length ? v.escalas.map(e => `<tr><td>${hd(e.dia, e.h)}</td><td>${esc(e.op)}<br><span class="sub">${esc(e.mot)}${e.substituido ? ' · substituiu o ' + vtxt(e.original) : ''}</span></td></tr>`).join('') : '<tr><td colspan="2" class="sub">Sem escala de ontem a amanhã</td></tr>'}</table>

    <div class="secao">Ações</div>
    ${v.status === 'INOPERANTE'
      ? `<div class="campo"><span>Seu nome (obrigatório)</span><input id="gvNome" autocomplete="off"></div>
         <div class="acoes"><button class="btn ok" id="gvLiberar">Liberar veículo</button></div>`
      : v.status === 'RETIDO' ? '<div class="sub" style="margin-top:6px">Retido pela manutenção: a liberação acontece na planilha de retenção.</div>'
      : `<div class="campo"><span>Motivo para marcar como inoperante</span><input id="gvMotivo" placeholder="Ex.: pneu, sem motorista, avaria…"></div>
         <div class="campo"><span>Seu nome (obrigatório)</span><input id="gvNome" autocomplete="off"></div>
         <div class="acoes"><button class="btn perigo" id="gvInop">Marcar inoperante</button></div>`}
    <div class="erro-msg" id="gvErro"></div>`;
  $('ovVeic').classList.add('aberto');
  $('gvFechar').onclick = () => $('ovVeic').classList.remove('aberto');
  const acao = async (fn, args, msg) => {
    const op = $('gvNome') ? $('gvNome').value.trim() : '';
    if (op.length < 3) { if ($('gvNome')) $('gvNome').focus(); return $('gvErro').textContent = 'Digite o seu nome.'; }
    try { await chamar(fn, ...args, op); toast(msg); $('ovVeic').classList.remove('aberto'); carregar(); }
    catch (e) { $('gvErro').textContent = e.message; }
  };
  if ($('gvLiberar')) $('gvLiberar').onclick = () => acao('liberarVeiculo', [v.num], 'Veículo ' + v.num + ' liberado.');
  if ($('gvInop')) $('gvInop').onclick = () => {
    const m = $('gvMotivo').value.trim();
    if (!m) return $('gvErro').textContent = 'Informe o motivo.';
    acao('definirInoperante', [v.num, m], 'Veículo ' + v.num + ' marcado como inoperante.');
  };
}

function abrirInfo(id){
  const i = (dados.info || []).find(x => x.id === id);
  if (!i) return;
  const itens = i.itens.map(x => i.tipo === 'veiculo'
    ? `<div class="li" data-v="${esc(x.num)}" title="Abrir veículo"><b>${vtxt(x.num)}</b><span class="sub">${esc(x.txt)}</span></div>`
    : `<div class="li"><b>${esc(x.h || '')}</b><span>${esc(x.txt)}</span></div>`).join('');
  $('gaveta').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px"><h3 style="font-size:19px">${esc(i.titulo)}</h3>${i.tipo !== 'texto' ? `<span class="badge" style="--c:var(--marca-escuro)">${i.itens.length}</span>` : ''}<span style="flex:1"></span><button class="btn" id="gvFechar">Fechar</button></div>
    <div class="sub" style="margin-top:6px;font-size:13px">${esc(i.desc)}</div>
    ${itens ? `<div class="lista-info">${itens}</div>` : ''}
    ${i.tipo === 'veiculo' ? '<div class="sub" style="margin-top:8px">Clique em um veículo para ver os detalhes.</div>' : ''}`;

}

/* ---------- vista Escalas ---------- */
let vista = 'operacao', escDia = 0;
try { vista = localStorage.getItem('vistaPainel') || 'operacao'; } catch (e) {}
function trocarVista(v){
  vista = v;
  document.querySelectorAll('.abas button').forEach(b => b.classList.toggle('ativo', b.dataset.vista === v));
  ['operacao', 'frota', 'escalas', 'manutencao', 'cadastros'].forEach(n => {
    const el = $('v' + n.charAt(0).toUpperCase() + n.slice(1));
    if (el) el.style.display = n === v ? '' : 'none';
  });
  try { localStorage.setItem('vistaPainel', v); } catch (e) {}
  if (v === 'escalas' && dados) renderEscalas();
}
document.querySelectorAll('.abas button').forEach(b => b.onclick = () => trocarVista(b.dataset.vista));
$('escBusca').addEventListener('input', () => dados && renderEscalas());
$('escOcultar').addEventListener('change', () => dados && renderEscalas());

const ORDEM_ORIGEM = ['METROPOLITANO', 'RECONCAVO', 'RECÔNCAVO', 'SALVADOR X IRARÁ', 'FRETAMENTO', 'FRETAMENTO BYD - ADM', 'FRETAMENTO BYD - TURNO'];
const slug = t => 'g-' + String(t).normalize('NFD').replace(/[^\w]+/g, '-');

function renderEscalas(){
  const todas = dados.escalas || [];
  const nTr = todas.filter(e => e.substituido && e.dias >= 0).length;
  $('nTrocas').style.display = nTr ? '' : 'none'; $('nTrocas').textContent = nTr;
  const cont = d => todas.filter(e => e.dias === d).length;
  $('escDias').innerHTML = [[-1, 'Ontem'], [0, 'Hoje'], [1, 'Amanhã']].map(([d, l]) =>
    `<button data-dia="${d}" class="${escDia === d ? 'ativo' : ''}">${l}<small>${cont(d)}</small></button>`).join('');
  $('escDias').querySelectorAll('button').forEach(b => b.onclick = () => { escDia = +b.dataset.dia; renderEscalas(); });

  const q = $('escBusca').value.trim().toUpperCase();
  const ocultar = $('escOcultar').checked && escDia === 0;
  const porVeic = {}; dados.veiculos.forEach(v => porVeic[v.num] = v);
  const lista = todas.filter(e => e.dias === escDia)
    .filter(e => !ocultar || e.falta >= -15)
    .filter(e => !q || [e.op, e.veic, ANT[e.veic] || '', e.original, e.mot, e.origem].join(' ').toUpperCase().includes(q));
  $('escConta').textContent = lista.length + ' escala(s)';

  const grupos = {};
  lista.forEach(e => (grupos[e.origem] = grupos[e.origem] || []).push(e));
  const nomes = Object.keys(grupos).sort((a, b) => {
    const ia = ORDEM_ORIGEM.indexOf(a), ib = ORDEM_ORIGEM.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  $('escIndice').innerHTML = nomes.length ? nomes.map(n => `<a href="#${slug(n)}">${esc(n)}<b>${grupos[n].length}</b></a>`).join('') : '<div class="vazio">—</div>';
  $('escGrupos').innerHTML = nomes.length ? nomes.map(n => {
    const ls = grupos[n];
    const trocas = ls.filter(e => e.substituido).length;
    return `<section class="grupo" id="${slug(n)}"><h2>${esc(n)}<span class="sub">${ls.length} escala(s)${trocas ? ' · ' + trocas + ' troca(s)' : ''}</span></h2>
      <table class="esc"><thead><tr><th style="width:90px">Horário</th><th>Operação</th><th style="width:170px">Veículo</th><th style="width:130px">Situação</th><th>Motorista</th><th style="width:90px"></th></tr></thead><tbody>
      ${ls.map(e => {
        const v = porVeic[e.veic];
        const s = v ? (STATUS[v.status] || { txt: v.status, c: 'var(--cinza)' }) : { txt: '—', c: 'var(--cinza)' };
        const prob = v && (v.status === 'RETIDO' || v.status === 'INOPERANTE') && e.falta >= 0;
        const tt = e.troca ? `Trocado por ${e.troca.operador || '?'} em ${e.troca.quando || ''}: ${e.troca.motivo || ''}` : '';
        return `<tr class="${e.falta < 0 && escDia === 0 ? 'passou' : ''} ${prob ? 'problema' : ''} ${e.substituido ? 'trocado' : ''}">
          <td class="hr">${esc(e.h)}</td>
          <td>${esc(e.op)}</td>
          <td class="vc" title="${esc(tt)}">${vtxt(e.veic)}${e.substituido ? `<s>era ${vtxt(e.original)}</s>` : ''}</td>
          <td><span class="badge" style="--c:${s.c}">${s.txt}</span></td>
          <td>${esc(e.mot)}</td>
          <td><button class="btn" data-troca="${esc(e.id)}">Trocar</button></td>
        </tr>`;
      }).join('')}</tbody></table></section>`;
  }).join('') : '<div class="vazio">Nenhuma escala neste dia' + (ocultar ? ' (os horários que já passaram estão ocultos)' : '') + '.</div>';
  $('escGrupos').querySelectorAll('[data-troca]').forEach(b => b.onclick = ev => { ev.stopPropagation(); abrirTroca(b.dataset.troca); });
}

/** Confere o veículo digitado para assumir as escalas "alvos": situação, conflito de horário (±90 min) e combustível. */
function conferirVeiculo(digitado, alvos){
  const n = (() => { const x = String(digitado || '').replace(/\D/g, '').replace(/^0+(?=\d)/, ''); for (const k in ANT) if (ANT[k] === x) return k; return x; })();
  if (!n) return '';
  const v = (dados.veiculos || []).find(x => x.num === n);
  const msgs = [];
  if (!v) msgs.push(['atencao', 'Veículo ' + n + ' não está no painel. Confira o número.']);
  else {
    if (v.status === 'RETIDO') msgs.push(['ruim', 'Retido: ' + ((v.retencao && v.retencao.defeito) || '')]);
    else if (v.status === 'INOPERANTE') msgs.push(['ruim', 'Inoperante: ' + ((v.manual && v.manual.motivo) || '')]);
    const min = e => e.dias * 1440 + (+e.h.slice(0, 2)) * 60 + (+e.h.slice(3, 5));
    const ids = new Set(alvos.map(e => e.id));
    const vistos = new Set();
    alvos.forEach(e => (dados.escalas || []).filter(o => o.veic === n && !ids.has(o.id) && Math.abs(min(o) - min(e)) <= 90).forEach(o => {
      if (vistos.has(o.id)) return; vistos.add(o.id);
      msgs.push(['atencao', 'Choque de horário: já está escalado ' + hd(o.dia, o.h) + ' · ' + o.op]);
    }));
    if (v.combustivel && v.combustivel.precisa) msgs.push(['atencao', 'Combustível estimado em ' + v.combustivel.pct + '%']);
    if (!msgs.length) msgs.push(['ok', '✓ ' + ((STATUS[v.status] || {}).txt || '') + (v.naGaragem ? ' · na garagem' : v.cidade ? ' · ' + v.cidade : '') + ' · sem conflito de horário']);
  }
  return msgs.map(([k, t]) => `<div class="aviso-troca ${k}">${esc(t)}</div>`).join('');
}

function abrirTroca(id){
  const e = (dados.escalas || []).find(x => x.id === id);
  if (!e) return;
  const porVeic = {}; dados.veiculos.forEach(v => porVeic[v.num] = v);
  const opcoes = dados.veiculos.slice().sort((a, b) => (a.status === 'DISPONIVEL' ? 0 : 1) - (b.status === 'DISPONIVEL' ? 0 : 1) || a.num - b.num)
    .map(v => `<option value="${esc(v.num)}">${esc((STATUS[v.status] || {}).txt || v.status)}${ANT[v.num] ? ' · ' + esc(ANT[v.num]) : ''}${v.placa ? ' · ' + esc(v.placa) : ''}</option>`).join('');
  $('gaveta').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px"><h3 style="font-size:20px">Trocar veículo</h3><span style="flex:1"></span><button class="btn" id="gvFechar">Cancelar</button></div>
    <table class="tab">
      <tr><td>Escala</td><td><b>${esc(hd(e.dia, e.h))}</b> · ${esc(e.op)}<br><span class="sub">${esc(e.origem)} · ${esc(e.mot)}</span></td></tr>
      <tr><td>Veículo atual</td><td><b>${vtxt(e.veic)}</b>${e.substituido ? ` <span class="sub">(original: ${vtxt(e.original)})</span>` : ''}</td></tr>
    </table>
    <div class="campo"><span>Novo veículo</span><input id="trNovo" list="trLista" inputmode="numeric" placeholder="Digite o número (qualquer um dos dois números de ordem)"><datalist id="trLista">${opcoes}</datalist></div>
    <div id="trCheck"></div>
    <div class="campo"><span>Motivo da troca (obrigatório)</span><input id="trMotivo" placeholder="Ex.: carro retido, avaria, ajuste de escala…"></div>
    <div class="campo"><span>Seu nome (obrigatório)</span><input id="trNome" autocomplete="off"></div>
    <div class="erro-msg" id="trErro"></div>
    <div class="acoes"><button class="btn prim" id="trOk">Confirmar troca</button>
      ${e.substituido ? `<button class="btn" id="trVolta">Voltar ao original (${esc(e.original)})</button>` : ''}</div>`;
  $('ovVeic').classList.add('aberto');
  $('gvFechar').onclick = () => $('ovVeic').classList.remove('aberto');

  $('trNovo').oninput = () => { $('trCheck').innerHTML = conferirVeiculo($('trNovo').value, [e]); };
  const salvar = async novo => {
    const motivo = $('trMotivo').value.trim(), nome = $('trNome').value.trim();
    $('trErro').textContent = '';
    if (!novo) return $('trErro').textContent = 'Informe o novo veículo.';
    if (!motivo) return $('trErro').textContent = 'Informe o motivo da troca.';
    if (nome.length < 3) return $('trErro').textContent = 'Digite o seu nome.';
    $('trOk').disabled = true;
    try { await chamar('trocarVeiculoEscala', e.id, novo, motivo, nome); toast('Troca registrada.'); $('ovVeic').classList.remove('aberto'); carregar(); }
    catch (err) { $('trErro').textContent = err.message; }
    finally { if ($('trOk')) $('trOk').disabled = false; }
  };
  $('trOk').onclick = () => salvar($('trNovo').value.trim());
  if ($('trVolta')) $('trVolta').onclick = () => salvar(e.original);
  $('trNovo').focus();
}

function toast(m){ const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2500); }

  document.documentElement.dataset.tema = t;
  $('btnTema').textContent = t === 'escuro' ? '☀️ Modo dia' : '🌙 Modo noite';
  try { localStorage.setItem('temaFrota', t); } catch (e) {}
}
